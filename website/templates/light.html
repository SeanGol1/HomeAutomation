    <div>
        <a class="btn btn-primary btn-block mb-2" id="add-light" href="/addLight">Add New Light</a>
    </div>

    <div class="container mt-4">

  <div class="row">
    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-lightbulb-o"></i> Corner Lamp</div>
        <div class="card-body">
          <button class="btn btn-primary btn-block mb-2" id="lampswitch">Toggle ON/OFF</button>
          <button class="btn btn-secondary btn-block" id="lampbright">Toggle Brightness</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-lightbulb-o"></i> Main Light</div>
        <div class="card-body">
          <button class="btn btn-primary btn-block mb-2" id="lightswitch">Toggle ON/OFF</button>
          <button class="btn btn-secondary btn-block" id="lightbright">Toggle Brightness</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-lightbulb-o"></i> Hall Light</div>
        <div class="card-body">
          <button class="btn btn-primary btn-block mb-2" id="hallswitch">Toggle ON/OFF</button>
          <button class="btn btn-secondary btn-block" id="hallbright">Toggle Brightness</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-power-off"></i> Global Controls</div>
        <div class="card-body">
          <button class="btn btn-danger btn-block mb-2" id="lightsoff">Lights Out</button>
          <button class="btn btn-warning btn-block mb-2" id="poweroff">Sleep</button>
          <button class="btn btn-success btn-block" id="wakeup">Wake</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-spotify"></i> Spotify</div>
        <div class="card-body">
          <button class="btn btn-info btn-block" id="spotify">Toggle Spotify</button>
        </div>
      </div>
    </div>

    <div class="col-md-6 mb-4">
      <div class="card bg-dark text-light">
        <div class="card-header"><i class="fa fa-television"></i> FireStick Control</div>
        <div class="card-body">
          <button class="btn btn-info btn-block mb-2" id="next_episode">Next Episode</button>
          <button class="btn btn-info btn-block mb-2" id="playpause">Play/Pause</button>
          <button class="btn btn-info btn-block mb-2" id="recent_show">Most Recent Show</button>
          <button class="btn btn-info btn-block" id="formula1">Formula 1</button>
        </div>
      </div>
    </div>

  </div>

</div>

    
{% endblock %}
