<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fire Stick Remote</title>
    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            margin-bottom: 30px;
            color: #f1f1f1;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 12px;
        }

        button {
            background-color: #1f1f1f;
            color: #fff;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 15px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #333;
            border-color: #555;
        }

        .spacer {
            visibility: hidden;
        }

        .row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 60px);
            }

            button {
                padding: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <h1>🔥 Fire Stick Remote</h1>
    <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='/dashboard'"><i
                                class="fas fa-home"></i> Back to Dashboard </button>
    <form method="POST">
        <div class="row" style="margin-bottom: 30px;">
            <button name="action" value="power">🔌 Power</button>
        </div>
        <div class="grid">
            <div class="spacer"></div>
            <button name="action" value="up">⬆</button>
            <div class="spacer"></div>

            <button name="action" value="left">⬅</button>
            <button name="action" value="ok">OK</button>
            <button name="action" value="right">➡</button>

            <div class="spacer"></div>
            <button name="action" value="down">⬇</button>
            <div class="spacer"></div>
        </div>

        <div class="row">
            <button name="action" value="home">🏠 Home</button>
            <button name="action" value="back">⏪ Back</button>
            <button name="action" value="menu">☰ Menu</button>
        </div>

        <div class="row">
            <button name="action" value="play_pause">⏯ Play/Pause</button>
            <button name="action" value="rewind">⏪ Rewind</button>
            <button name="action" value="fast_forward">⏩ FF</button>
        </div>
    </form>
</body>
</html>
