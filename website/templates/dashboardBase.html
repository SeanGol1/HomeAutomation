<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <title>Smart Home Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a2e0d4b308.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flipclock/0.7.8/flipclock.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">

</head>

<body>
    <div class="d-flex">
         <!-- Sidebar -->
        <div id="sidebar" class="">
            <ul class="nav flex-column"> 
                <li class="nav-item ">
                    <a class="nav-link align-items-center" href="/dashboard"><i class="fas fa-home"></i></a><!--Home-->
                </li>
                <li class="nav-item ">
                    <a class="nav-link align-items-center" href="/devicesDashboard"><i class="fas fa-lightbulb"></i></a><!--Devices-->
                </li>
                <li class="nav-item">
                    <a class="nav-link align-items-center" href="/scenes"><i class="fas fa-clapperboard"></i></a><!--Scenes-->
                </li>
                <li class="nav-item">
                    <a class="nav-link align-items-center" href="/settings"><i class="fas fa-cogs"></i></a><!--Settings-->
                </li>
            </ul>

            <label class="switch">
                <input class="switch__input" type="checkbox" role="switch" id="darkModeToggle">
                <svg class="switch__icon switch__icon--light" viewBox="0 0 12 12" width="12px" height="12px" aria-hidden="true">
                    <g fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round">
                        <circle cx="6" cy="6" r="2" />
                        <g stroke-dasharray="1.5 1.5">
                            <polyline points="6 10,6 11.5" transform="rotate(0,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(45,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(90,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(135,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(180,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(225,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(270,6,6)" />
                            <polyline points="6 10,6 11.5" transform="rotate(315,6,6)" />
                        </g>
                    </g>
                </svg>
                <svg class="switch__icon switch__icon--dark" viewBox="0 0 12 12" width="12px" height="12px" aria-hidden="true">
                    <g fill="none" stroke="#fff" stroke-width="1" stroke-linejoin="round" transform="rotate(-45,6,6)">
                        <path d="m9,10c-2.209,0-4-1.791-4-4s1.791-4,4-4c.304,0,.598.041.883.105-.995-.992-2.367-1.605-3.883-1.605C2.962.5.5,2.962.5,6s2.462,5.5,5.5,5.5c1.516,0,2.888-.613,3.883-1.605-.285.064-.578.105-.883.105Z"/>
                    </g>	
                </svg>
                <span class="switch__sr">Dark Mode</span>
            </label>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-3" id="main-content">
            <!-- Your gridstack dashboard and controls go here -->
            {% block content %}
            <!-- Main dashboard content -->
            {% endblock %}
        </div>
    </div>

    <!-- JavaScript -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha384-+r6gDfG5/wCqu3OyXQYbM/h2vGzt6KoYzVxNfCLxlyyNHm2YLa0bGbHzrTNBvUjL"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@9.2.2/dist/gridstack-all.min.js"></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>

</html>
